  <rect x="138" y="268" width="198" height="13" rx="6" fill="#e2e8f0"/>
  <rect x="138" y="294" width="158" height="13" rx="6" fill="#e2e8f0"/>

  <!-- Aralıklı tekrar göstergesi: üç nokta -->
